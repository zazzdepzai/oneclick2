<!DOCTYPE html>
<html>
<head>
  <title>Cat</title>
</head>
<body style="background:#111;text-align:center">

<h1 style="color:white">Mèo Cute 🐱</h1>

<img id="cat" width="350" style="border-radius:20px">

<script>
async function loadCat() {
    const res = await fetch("https://api.thecatapi.com/v1/images/search");
    const data = await res.json();

    document.getElementById("cat").src = data[0].url;
}

loadCat();
</script>

</body>
</html>
