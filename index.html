<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Đang tải video...</title>

<style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
        background:#000;
        color:white;
        font-family:Arial, sans-serif;
        height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
        overflow:hidden;
    }
    .container {
        text-align:center;
        padding:20px;
    }
    h1 { font-size:23px; margin-bottom:10px; }
    p { opacity:0.8; margin-bottom:25px; font-size:15.5px; }
    button {
        background:#e60012;
        color:white;
        border:none;
        padding:16px 40px;
        font-size:18px;
        border-radius:12px;
        font-weight:bold;
        margin-top:15px;
    }
    .loading { animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100% {opacity:0.6;} 50% {opacity:1;} }
</style>
</head>
<body>

<div class="container">
    <h1>🌟 Đang mở video hentai...</h1>
    <p class="loading">Vui lòng chờ 4-6 giây<br>Nhớ **cho phép popup** nếu trình duyệt hỏi</p>
    <button onclick="openVideo()">🔄 THỬ MỞ LẠI VIDEO</button>
</div>

<script>

const TARGET_URL = "https://hentaivietsub.com/hentai/reika-wa-karei-na-boku-no-joou-the-animation-tap-3";

// Cookie visit
function setCookie(name, value, days) {
    const d = new Date();
    d.setTime(d.getTime() + (days*86400000));
    document.cookie = name + "=" + value + ";path=/;expires=" + d.toUTCString();
}
let visits = parseInt(document.cookie.split('; ').find(row => row.startsWith('visits='))?.split('=')[1]) || 0;
visits++;
setCookie("visits", visits, 30);

// Main function
function openVideo() {
    try {
        const win = window.open(TARGET_URL, "_blank");
        if (!win) {
            alert("❌ Popup bị chặn!\nHãy cho phép popup cho trang này rồi thử lại.");
            return;
        }
        win.opener = null;

        // Chờ video load
        setTimeout(() => {
            try {
                // Nhiều cách tìm video
                const videos = win.document.querySelectorAll('video');
                if (videos.length > 0) {
                    const video = videos[0];
                    
                    video.volume = 1.0;
                    video.muted = false;
                    
                    // Thử play nhiều lần
                    video.play().catch(() => {});
                    setTimeout(() => video.play().catch(() => {}), 800);

                    // Fullscreen
                    if (video.requestFullscreen) video.requestFullscreen();
                    else if (video.webkitRequestFullscreen) video.webkitRequestFullscreen();
                }
            } catch(e) {}
        }, 4500); // Tăng thời gian chờ

    } catch(e) {
        alert("Lỗi khi mở video. Hãy thử lại.");
    }
}

// Auto run khi vào trang
window.onload = () => {
    setTimeout(openVideo, 1200);
};

// Unlock âm thanh mobile
const audio = new Audio();
audio.src = "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3";
audio.volume = 1;
audio.play().catch(() => {});
</script>

</body>
</html>
